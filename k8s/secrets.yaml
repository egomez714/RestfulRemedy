# Replace these values before applying. Values are plain strings (not base64)
# because we use stringData. Do NOT commit real secrets to git — this is a
# template. In real environments use sealed-secrets, external-secrets, or
# kubectl create secret from the CLI.
apiVersion: v1
kind: Secret
metadata:
  name: restfulremedy-secrets
  namespace: restfulremedy
type: Opaque
stringData:
  DATABASE_PASSWORD: "restfulremedy"
  CLAUDE_KEY: "REPLACE_WITH_YOUR_ANTHROPIC_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: restfulremedy
type: Opaque
stringData:
  POSTGRES_PASSWORD: "restfulremedy"
